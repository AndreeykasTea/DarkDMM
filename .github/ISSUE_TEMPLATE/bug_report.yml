name: Ошибка
description: Сообщить об ошибке или вылете
title: "Ошибка: "
labels: [ bug ]
body:
  - type: input
    attributes:
      label: Версия
      description: Версия DarkDMM, она указана в окне «Справка → О программе».
    validations:
      required: true
  - type: textarea
    attributes:
      label: Что случилось?
      description: Что произошло и что должно было произойти.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Как повторить
      description: Шаги, которые приводят к ошибке. Укажите сборку и карту, если это важно.
      value: |
        1. Открыть DarkDMM
    validations:
      required: true
  - type: textarea
    attributes:
      label: Логи
      description: Логи лежат в папке «Справка → Открыть папку логов». Текст форматировать не нужно.
      render: bash
